name: Android Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is required: tool/ci_version.sh derives the version from
      # the commit count, which collapses to 1 on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # versionName = <MAJOR.MINOR from pubspec.yaml>.<commit count>,
      # versionCode = <commit count>. See tool/ci_version.sh.
      - name: Compute version
        id: version
        run: bash tool/ci_version.sh

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # A step's own `env:` block is not visible to that step's `if:`, so the
      # original `env.KEYSTORE_BASE64 != ''` was always false and the signing
      # step below never ran — the real release keystore was never written even
      # with the secrets set. `secrets` is not an available context in a step
      # `if:` either, so probe for the secret in a step and pass the answer on
      # as an output. Deliberately not job-level `env:`, which would expose the
      # keystore to every step in the job, third-party actions included.
      - name: Check for a release keystore
        id: keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set; building with the debug signing key."
          fi

      - name: Set up release signing
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      # The APK/AAB are renamed to carry the version so a downloaded artifact
      # is self-identifying. APK_PATH/AAB_PATH are exported to $GITHUB_ENV so
      # every later step (verification, uploads, releases) uses one path.
      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            APK_NAME="sms-scheduler-pr${PR_NUMBER}-v${VERSION_NAME}.apk"
          else
            APK_NAME="sms-scheduler-v${VERSION_NAME}.apk"
          fi
          APK_PATH="build/app/outputs/flutter-apk/${APK_NAME}"
          mv build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"
          echo "APK_PATH=${APK_PATH}" >> "$GITHUB_ENV"
          echo "Built $APK_PATH"

      # A wrongly-signed APK still builds and tests green, and only fails later
      # at sign-in on a device. Print the fingerprint so it is checkable here.
      - name: Report APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Build AAB
        if: github.event_name == 'push'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME"
          AAB_PATH="build/app/outputs/bundle/release/sms-scheduler-v${VERSION_NAME}.aab"
          mv build/app/outputs/bundle/release/app-release.aab "$AAB_PATH"
          echo "AAB_PATH=${AAB_PATH}" >> "$GITHUB_ENV"
          echo "Built $AAB_PATH"

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sms-scheduler-pr-${{ github.event.number }}
          path: ${{ env.APK_PATH }}

      # PR artifacts download as a ZIP and require a GitHub login, which is
      # awkward on a phone. Publish the APK as a prerelease as well so it has
      # a direct, one-tap download link. Skipped for fork PRs, whose
      # read-only token cannot create releases.
      - name: Publish PR prerelease
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: PR #${{ github.event.number }} test build
          prerelease: true
          body: |
            Test build of PR #${{ github.event.number }}, version
            ${{ steps.version.outputs.name }} (build
            ${{ steps.version.outputs.code }}). Not a release.

            Commit: ${{ github.event.pull_request.head.sha }}
          files: ${{ env.APK_PATH }}

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
