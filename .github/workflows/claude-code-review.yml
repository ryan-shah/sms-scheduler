name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # `secrets` is not available in a step `if:`; probe and pass on an output.
      # Without the token (or on fork PRs, where secrets are withheld) the job
      # is skipped without failing the PR.
      - name: Check for Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude."
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.token.outputs.present == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Review against this repository's CLAUDE.md (build/test rules, Android-specific
            rules) and designs/DESIGN.md (authoritative scope, architecture, data model).
            Flag deviations from DESIGN.md that are not recorded in its deviation log.
          use_sticky_comment: true
          claude_args: '--allowedTools "Bash(gh *)" WebFetch'

      - name: Post review status comment
        if: always() && steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTCOME="${{ steps.claude-review.outcome }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="<!-- claude-review-status -->"

          if [ "$OUTCOME" = "success" ]; then
            BODY="${MARKER}
          :white_check_mark: **Claude Code Review** completed. Any findings have been posted as inline review comments. If no inline comments appear, no issues were found."
          else
            BODY="${MARKER}
          :warning: **Claude Code Review** did not complete — this may be due to a usage limit or a transient error. Please re-run the workflow or review manually."
          fi

          # Update existing status comment if present, otherwise create one
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | first | .id // empty")

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH --field "body=${BODY}"
          else
            gh pr comment "${PR_NUMBER}" --body "${BODY}" --repo "${{ github.repository }}"
          fi
