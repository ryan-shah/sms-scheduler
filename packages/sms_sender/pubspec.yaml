name: sms_sender
description: "In-repo Android plugin: multipart SMS send from the user's SIM with SENT aggregation."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rsh.sms_sender
        pluginClass: SmsSenderPlugin
